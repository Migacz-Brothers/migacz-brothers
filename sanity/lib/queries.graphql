query AllProjects {
  allProject {
    ...ProjectListing
  }
}

query ProjectBySlug($slug: String) {
  allProject(where: { slug: { current: { eq: $slug } } }) {
    ...ProjectListing
  }
}

fragment ProjectListing on Project {
  title
  description {
    pt
    en
    es
  }
  slug {
    current
  }
  executedAt {
    pt
    en
    es
  }
  read_time {
    pt
    en
    es
  }
  link
  body {
    ptRaw
    enRaw
    esRaw
  }
  image_column_1 {
    asset {
      url
      metadata {
        dimensions {
          width
          height
        }
      }
    }
  }
  image_column_2 {
    asset {
      url
      metadata {
        dimensions {
          width
          height
        }
      }
    }
  }
  tags
}
